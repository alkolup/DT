     * Ponechá řešení studenta — nepřepisuje správnými hodnotami.
     * Vrcholy a hrany dané v zadání (fixed-slot, pevné barvy hran) se nezvýrazňují.
     */
    const applyParkTaskFeedback = (parkRoot, expected, renderTokenInSlot) => {
      if (!parkRoot || !expected) return;
      const expNodes = expected.nodes || {};
      const expEdges = expected.edges || {};
      Object.keys(expNodes).forEach((slotId) => {
        const slotEl = parkRoot.querySelector(`[data-slot-id="${slotId}"]`);
        if (!slotEl || slotEl.classList.contains("fixed-slot")) return;
        const want = expNodes[slotId];
        const got = slotEl.dataset.letter || "";
        slotEl.classList.remove("park-slot-feedback-correct", "park-slot-feedback-incorrect");
        if (got === want) {
          slotEl.classList.add("park-slot-feedback-correct");
        } else {
          slotEl.classList.add("park-slot-feedback-incorrect");
        }
      });
      Object.keys(expEdges).forEach((edgeId) => {
        const el = parkRoot.querySelector(`[data-edge-id="${edgeId}"]`);
        if (!el || !el.classList.contains("edge-drop-target")) return;
        const wantName = expEdges[edgeId];
        const curIdx = Number(el.dataset.edgeIndex || "0");
        const curName = edgeNames[curIdx];
        el.classList.remove("park-edge-feedback-correct", "park-edge-feedback-incorrect");
        if (curName === wantName) {
          el.classList.add("park-edge-feedback-correct");
        } else {
          el.classList.add("park-edge-feedback-incorrect");
        }
      });
    };

    /**
     * Přepíše jen žákem měnitelné sloty a hrany hodnotami z expected.
     * Volá se až po kliknutí na „Zobraz mi správné řešení“.
     */
    const applyParkCorrectSolution = (parkRoot, expected, renderTokenInSlot) => {
      if (!parkRoot || !expected) return;
      const expNodes = expected.nodes || {};
      Object.keys(expNodes).forEach((slotId) => {
        const slotEl = parkRoot.querySelector(`[data-slot-id="${slotId}"]`);
        if (!slotEl || slotEl.classList.contains("fixed-slot")) return;
        const want = expNodes[slotId] || "";
        if (typeof renderTokenInSlot === "function") renderTokenInSlot(slotEl, want);
        else slotEl.dataset.letter = want;
      });
      const expEdges = expected.edges || {};
      Object.keys(expEdges).forEach((edgeId) => {
        const el = parkRoot.querySelector(`[data-edge-id="${edgeId}"]`);
        if (!el || !el.classList.contains("edge-drop-target")) return;
        const wantName = expEdges[edgeId];
        const idx = edgeNames.indexOf(wantName);
        if (idx < 0) return;
        el.dataset.edgeIndex = String(idx);
        el.style.background = edgePalette[idx];
      });
      clearParkPlayerCheckMarks(parkRoot);
    };

    /**
     * Další úloha → dialog sebehodnocení (14_DegreeSequenceTask), pak vizuální řešení a dokončení pokusu.
     */
    const wireParkFinishWithSelfAssessment = (opts) => {
      const {
        finishButton,
        idPrefix,
        logAction,
        blockUntilGhostIntroAnswered,
        getSnapshot,
        expected,
        renderTokenInSlot,
        buildTrialData,
        feedbackContinueLabel = "Pokračovat na další úlohu"
      } = opts;

      const ghostText = document.getElementById("ghost-text");
      const ghostButtons = document.getElementById("ghost-buttons");
      const ghostBubble = document.getElementById("ghost-bubble");
      const ghostUI = document.getElementById("ghost-ui");

      let parkSelfAssessmentOpen = false;
      let finishing = false;

      const gradeSnapshot = (snapshot) => {
        const nodeCorrect = Object.keys(expected.nodes || {}).every((id) => snapshot.nodes[id] === expected.nodes[id]);
        const edgeCorrect = Object.keys(expected.edges || {}).every((id) => snapshot.edges[id] === expected.edges[id]);
        const allCorrect = nodeCorrect && edgeCorrect;
        return { nodeCorrect, edgeCorrect, allCorrect };
      };

      const hideParkOutcomeGhost = () => {
        ghostBubble.classList.remove("degree-self-assessment-wide", "visible");
        ghostUI.style.transform = "scale(0.6)";
        ghostButtons.innerHTML = "";
      };

      const showParkOutcomeFeedback = async (allCorrect) => {
        logAction("outcome_feedback_shown", { all_correct: allCorrect });
        logAction("park_outcome_feedback_shown", { all_correct: allCorrect });
        ghostUI.style.transform = "scale(1)";
        ghostButtons.style.flexDirection = "column";
        ghostBubble.classList.add("degree-self-assessment-wide", "visible");
        if (allCorrect) {
          ghostText.innerHTML = "Výborně, máš to správně!";
          ghostButtons.innerHTML = `<button type="button" id="${idPrefix}feedback-continue" class="ghost-hint-btn">Pokračovat</button>`;
          return new Promise((resolve) => {
            document.getElementById(`${idPrefix}feedback-continue`).addEventListener(
              "click",
              () => {
                logAction("outcome_correct_continue_clicked", { all_correct: true });
                logAction("park_outcome_continue_clicked", { all_correct: true });
                hideParkOutcomeGhost();
                resolve("finish");
              },
              { once: true }
            );
          });
        }
        ghostText.innerHTML =
          "Máš tam chybu. Ukážu ti, které části nejsou správně, ale neprozradím ti řešení.";
        ghostButtons.innerHTML = `
          <button type="button" id="${idPrefix}feedback-retry" class="ghost-hint-btn">Chci to zkusit opravit</button>
          <button type="button" id="${idPrefix}feedback-solution" class="ghost-hint-btn">Zobraz mi správné řešení</button>
        `;
        return new Promise((resolve) => {
          const parkRoot = document.querySelector(".park-task-root");
          document.getElementById(`${idPrefix}feedback-retry`).addEventListener(
            "click",
            () => {
              logAction("outcome_incorrect_retry_clicked", { all_correct: false });
              clearParkPlayerCheckMarks(parkRoot);
              logAction("outcome_returned_to_solving", {});
              hideParkOutcomeGhost();
              ghostText.innerHTML = "Pokud budeš potřebovat nápovědu,<br>klikni na mě.";
              setDigitoolSelfAssessmentUiLock(false);
              parkSelfAssessmentOpen = false;
              resolve("retry");
            },
            { once: true }
          );
          document.getElementById(`${idPrefix}feedback-solution`).addEventListener(
            "click",
            () => {
              logAction("outcome_incorrect_show_solution_clicked", { all_correct: false });
              applyParkCorrectSolution(parkRoot, expected, renderTokenInSlot);
              logAction("park_correct_solution_revealed", {});
              ghostText.innerHTML = "Takhle vypadá správné řešení.";
              ghostButtons.innerHTML = `<button type="button" id="${idPrefix}feedback-solution-continue" class="ghost-hint-btn">Pokračovat</button>`;
              document.getElementById(`${idPrefix}feedback-solution-continue`).addEventListener(
                "click",
                () => {
                  logAction("outcome_solution_continue_clicked", { all_correct: false });
                  logAction("park_outcome_continue_clicked", { all_correct: false, solution_shown: true });
                  hideParkOutcomeGhost();
                  resolve("finish");
                },
                { once: true }
              );
            },
            { once: true }
          );
        });
      };

      const finishParkTrialWithAssessment = async (selfAssessmentCode, selfAssessmentLabel) => {
        if (finishing) return;
        finishing = true;
        try {
          logAction("self_assessment_chosen", {
            self_assessment: selfAssessmentCode,
            self_assessment_label: selfAssessmentLabel
          });
          logAction("finish_task_confirmed", {});
          ghostBubble.classList.remove("degree-self-assessment-wide", "visible");
          ghostUI.style.transform = "scale(0.6)";
          if (blockUntilGhostIntroAnswered && blockUntilGhostIntroAnswered("park-finish")) {
            parkSelfAssessmentOpen = false;
            setDigitoolSelfAssessmentUiLock(false);
            return;
          }

          const snapshot = getSnapshot();
          const { nodeCorrect, edgeCorrect, allCorrect } = gradeSnapshot(snapshot);
          const parkRoot = document.querySelector(".park-task-root");
          if (!allCorrect) {
            applyParkTaskFeedback(parkRoot, expected, renderTokenInSlot);
            logAction("park_post_feedback_student_solution_marked", {
              all_correct: allCorrect,
              node_correct: nodeCorrect,
              edge_correct: edgeCorrect
            });
            logAction("park_post_feedback_solution_marked", {
              all_correct: allCorrect,
              node_correct: nodeCorrect,
              edge_correct: edgeCorrect
            });
          }

          const outcomeChoice = await showParkOutcomeFeedback(allCorrect);
          if (outcomeChoice === "retry") return;
          parkSelfAssessmentOpen = false;

          const trialPayload = buildTrialData({
            snapshot,
            nodeCorrect,
            edgeCorrect,
            allCorrect,
            selfAssessmentCode,
            selfAssessmentLabel
          });
          jsPsych.finishTrial(trialPayload);
        } finally {
          finishing = false;
        }
      };

      const showParkSelfAssessmentDialog = () => {
        if (blockUntilGhostIntroAnswered && blockUntilGhostIntroAnswered("park-finish")) return;
        logAction("self_assessment_dialog_opened", {});
        parkSelfAssessmentOpen = true;
        setDigitoolSelfAssessmentUiLock(true);
        ghostUI.style.transform = "scale(1)";
        ghostText.innerHTML = "Myslíš si, že máš úlohu správně?";
        ghostButtons.style.flexDirection = "column";
        ghostButtons.innerHTML = `
              <button type="button" id="${idPrefix}self-continue" class="ghost-hint-btn">Chci ještě pokračovat v řešení.</button>
              <button type="button" id="${idPrefix}self-sure-correct" class="ghost-hint-btn">Vím jistě, že mám úlohu správně.</button>
              <button type="button" id="${idPrefix}self-correct" class="ghost-hint-btn">Myslím si, že mám úlohu správně.</button>
              <button type="button" id="${idPrefix}self-unsure" class="ghost-hint-btn">Nevím jistě, zda mám úlohu správně.</button>
              <button type="button" id="${idPrefix}self-error" class="ghost-hint-btn">Myslím si, že mám v úloze chybu, ale už nechci pokračovat v řešení.</button>
            `;
        ghostBubble.classList.add("degree-self-assessment-wide", "visible");

        document.getElementById(`${idPrefix}self-continue`).addEventListener("click", () => {
          logAction("park_self_assessment_continue_clicked", {});
          logAction("self_assessment_chosen", {
            self_assessment: "continue_solving",
            self_assessment_label: "Chci ještě pokračovat v řešení."
          });
          parkSelfAssessmentOpen = false;
          setDigitoolSelfAssessmentUiLock(false);
          ghostBubble.classList.remove("degree-self-assessment-wide", "visible");
          ghostUI.style.transform = "scale(0.6)";
          ghostText.innerHTML = "Pokud budeš potřebovat nápovědu,<br>klikni na mě.";
          ghostButtons.innerHTML = "";
        });
        document.getElementById(`${idPrefix}self-sure-correct`).addEventListener("click", () => {
          logAction("park_self_assessment_option_clicked", { code: "sure_correct" });
          finishParkTrialWithAssessment("sure_correct", "Vím jistě, že mám úlohu správně.");
        });
        document.getElementById(`${idPrefix}self-correct`).addEventListener("click", () => {
          logAction("park_self_assessment_option_clicked", { code: "think_correct" });
          finishParkTrialWithAssessment("think_correct", "Myslím si, že mám úlohu správně.");
        });
        document.getElementById(`${idPrefix}self-unsure`).addEventListener("click", () => {
          logAction("park_self_assessment_option_clicked", { code: "unsure" });
          finishParkTrialWithAssessment("unsure", "Nevím jistě, zda mám úlohu správně.");
        });
        document.getElementById(`${idPrefix}self-error`).addEventListener("click", () => {
          logAction("park_self_assessment_option_clicked", { code: "think_error" });
          finishParkTrialWithAssessment(
            "think_error",
            "Myslím si, že mám v úloze chybu, ale už nechci pokračovat v řešení."
          );
        });
      };

      finishButton.addEventListener("click", () => {
        if (parkSelfAssessmentOpen) return;
        logAction("park_finish_button_clicked", {});
        showParkSelfAssessmentDialog();
      });
    };

    const PARK_MAP_EDGES_DATA = [
      [335, 95, 600, 95, "#f2cf3f"],
      [600, 95, 750, 250, "#d50000"],
      [750, 250, 865, 95, "#d50000"],
      [865, 95, 960, 270, "#0066e6"],
      [600, 95, 865, 95, "#d50000"],
      [240, 270, 335, 95, "#0066e6"],
      [240, 270, 450, 250, "#008a00"],
      [240, 270, 335, 470, "#d50000"],
      [450, 250, 600, 95, "#d50000"],
      [450, 250, 335, 95, "#0066e6"],
      [450, 250, 750, 250, "#0066e6"],
      [450, 250, 335, 470, "#f2cf3f"],
      [450, 250, 600, 410, "#f2cf3f"],
      [750, 250, 600, 95, "#008a00"],
      [750, 250, 865, 95, "#008a00"],
      [750, 250, 960, 270, "#d50000"],
      [750, 250, 600, 410, "#0066e6"],
      [750, 250, 865, 470, "#d50000"],
      [335, 470, 600, 410, "#d50000"],
      [335, 470, 500, 585, "#008a00"],
      [500, 585, 600, 410, "#f2cf3f"],
      [500, 585, 700, 585, "#008a00"],
      [600, 410, 700, 585, "#008a00"],
      [600, 410, 865, 470, "#d50000"],
      [700, 585, 865, 470, "#f2cf3f"],
      [865, 470, 960, 270, "#0066e6"]
    ];

    const parkMapEdgeGroup = ([x1, y1, x2, y2, stroke]) => {
      const key = `${x1}_${y1}_${x2}_${y2}`;
      return `<g class="park-map-edge" data-edge-key="${key}">
      <line class="park-map-edge-underlay" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#111" stroke-width="38" stroke-linecap="round" opacity="0" pointer-events="none"/>
      <line class="park-map-edge-line" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="26" stroke-linecap="round" pointer-events="stroke"/>
    </g>`;
    };

    const parkMapNodeGroup = (letter, cx, cy) => {
      const emoji = TOKEN_MAP[letter] || "";
      const lx = cx + 42;
      let emojiInner;
      if (letter === "H") {
        emojiInner = `<text x="${cx}" y="${cy}" font-size="55" text-anchor="middle" dominant-baseline="middle" transform="translate(${cx} ${cy}) scale(-1 1) translate(${-cx} ${-cy})">${emoji}</text>`;
      } else if (letter === "T") {
        emojiInner = `<text x="${cx}" y="${cy}" font-size="55" text-anchor="middle" dominant-baseline="middle" transform="rotate(30 ${cx} ${cy})">${emoji}</text>`;
      } else {
        emojiInner = `<text x="${cx}" y="${cy}" font-size="55" text-anchor="middle" dominant-baseline="middle">${emoji}</text>`;
      }
      return `<g class="park-map-node" data-park-letter="${letter}" style="cursor:pointer">
    <circle class="park-map-node-disc" cx="${cx}" cy="${cy}" r="48" fill="#d9d9d9" stroke="#222" stroke-width="2"/>
    ${emojiInner}
    <text x="${lx}" y="${cy}" text-anchor="end" dominant-baseline="middle" font-size="44" font-weight="900">${letter}</text>
  </g>`;
    };

    const PARK_MAP_NODES_META = [
      ["P", 335, 95],
      ["B", 600, 95],
      ["H", 865, 95],
      ["J", 240, 270],
      ["M", 450, 250],
      ["R", 750, 250],
      ["O", 960, 270],
      ["L", 335, 470],
      ["T", 600, 410],
      ["C", 865, 470],
      ["K", 500, 585],
      ["A", 700, 585]
    ];

    const buildParkMapSvgInner = () => {
      const edges = PARK_MAP_EDGES_DATA.map(parkMapEdgeGroup).join("");
      const nodes = PARK_MAP_NODES_META.map(([l, x, y]) => parkMapNodeGroup(l, x, y)).join("");
      return `<g stroke-linecap="round">${edges}</g><g font-family="Arial, Helvetica, sans-serif">${nodes}</g>`;
    };

    const parkMapSvg = (vbW) =>
      `<svg class="park-map" viewBox="0 0 ${vbW} 650" xmlns="http://www.w3.org/2000/svg" aria-label="Mapa s uzly a barevnými cestami">${buildParkMapSvgInner()}</svg>`;

    const parkMapToolbarHtml = () =>
      `<div class="park-map-toolbar"><button type="button" class="custom-task-btn park-clear-map-selection">Smazat označení</button></div>`;

    const parkMapWithToolbar = (vbW) => `${parkMapToolbarHtml()}${parkMapSvg(vbW)}`;

    /** Klikací mapa: tyrkysová výplň jen podle kódu (nabídka/cesty); na mapě jen tučný obrys uzlů/hran. */
    const attachParkMapInteractions = (rootEl, logAction) => {
      const svg = rootEl.querySelector(".park-map");
      if (!svg)
        return {
          clearOutline: () => {},
          clearTurquoise: () => {},
          setTurquoiseLetter: () => {},
          svg: null
        };

      const clearOutline = () => {
        svg.querySelectorAll(".park-map-node.is-outline-selected").forEach((el) => el.classList.remove("is-outline-selected"));
        svg.querySelectorAll(".park-map-edge.is-outline-selected").forEach((el) => el.classList.remove("is-outline-selected"));
      };

      const clearTurquoise = () => {
        svg.querySelectorAll(".park-map-node.is-letter-focus").forEach((el) => el.classList.remove("is-letter-focus"));
      };

      const setTurquoiseLetter = (letter) => {
        clearTurquoise();
        if (!letter || !isParkCropLetter(letter)) return;
        const n = svg.querySelector(`.park-map-node[data-park-letter="${letter}"]`);
        if (n) n.classList.add("is-letter-focus");
      };

      svg.addEventListener("click", (ev) => {
        const node = ev.target.closest(".park-map-node");
        const edge = ev.target.closest(".park-map-edge");
        if (node) {
          ev.stopPropagation();
          const sel = node.classList.toggle("is-outline-selected");
          logAction("park_map_node_outline_toggle", { letter: node.dataset.parkLetter, selected: sel });
          return;
        }
        if (edge && ev.target.classList.contains("park-map-edge-line")) {
          ev.stopPropagation();
          const sel = edge.classList.toggle("is-outline-selected");
          logAction("park_map_edge_outline_toggle", { edge_key: edge.dataset.edgeKey, selected: sel });
          return;
        }
        if (edge) {
          ev.stopPropagation();
          logAction("park_map_edge_click_nonstroke", { edge_key: edge.dataset.edgeKey });
          return;
        }
        logAction("park_map_click_background", {});
      });

      rootEl.querySelectorAll(".park-clear-map-selection").forEach((btn) => {
        btn.addEventListener("click", (ev) => {
          ev.preventDefault();
          clearOutline();
          logAction("park_map_clear_outline", {});
        });
      });

      return { clearOutline, clearTurquoise, setTurquoiseLetter, svg };
    };

    const tokenIconInner = (letter) => {
      if (isParkEmptyToken(letter)) return `<span class="token-icon token-icon--empty" aria-hidden="true"></span>`;
      const raw = TOKEN_MAP[letter] || "";
      if (letter === "H") return `<span class="token-icon token-icon--flip-y">${raw}</span>`;
      if (letter === "T") return `<span class="token-icon token-icon--rot30">${raw}</span>`;
      return `<span class="token-icon">${raw}</span>`;
    };

    const tokenChip = (letter, draggable = false) => {
      const isEmpty = isParkEmptyToken(letter);
      return `
      <div class="token-chip ${draggable ? "palette-token" : ""} ${isEmpty ? "token-chip--empty" : ""}" data-letter="${letter}" ${draggable ? `draggable="true"` : ""} title="${isEmpty ? "Prázdný vrchol" : ""}" aria-label="${isEmpty ? "Prázdný vrchol" : letter}">
        ${tokenIconInner(letter)}
        ${isEmpty ? "" : `<span class="token-letter">${letter}</span>`}
      </div>
    `;
    };

    /** Drag ghost vycentrovaný pod kurzorem (ne u místa kliknutí v chipu). */
    const setCenteredDragImage = (dataTransfer, el) => {
      if (!dataTransfer || !el || typeof dataTransfer.setDragImage !== "function") return;
      const rect = el.getBoundingClientRect();
      dataTransfer.setDragImage(el, rect.width / 2, rect.height / 2);
    };

    /**
     * Přetahování všech vrcholů (nabídka + fixní + vyplněné sloty) do drop-targetů.
     * Token se kopíruje (zdroj zůstává), stejně jako z nabídky pod úlohou.
     * Kliknutí vybere token pro následné přiřazení kliknutím na slot.
     */
    const wireParkVertexDragSources = (parkRoot, opts) => {
      const {
        logAction,
        getDragLetterRef,
        setDragLetter,
        setDragColorIdx,
        onAfterDragStart,
        syncTokenDraggable,
        clickAssign,
        isMapFindActive
      } = opts;

      let dragContext = null;
      let dragDropped = false;

      const getDragContext = () => dragContext || {};
      const markDragDropped = () => {
        dragDropped = true;
      };

      parkRoot.addEventListener("dragstart", (ev) => {
        const chip = ev.target.closest(".token-chip.palette-token");
        if (!chip || !parkRoot.contains(chip)) return;
        if (chip.closest(".color-swatch")) return;
        const letter = chip.dataset.letter || "";
        if (!isParkAssignableLetter(letter)) return;
        dragDropped = false;
        setDragLetter(letter);
        if (setDragColorIdx) setDragColorIdx(null);
        if (clickAssign) clickAssign.clearSelection(null, null);
        if (ev.dataTransfer) {
          ev.dataTransfer.setData("text/plain", letter);
          ev.dataTransfer.effectAllowed = "copy";
          setCenteredDragImage(ev.dataTransfer, chip);
        }
        const sourceSlot = chip.closest(".task-slot");
        dragContext = {
          letter,
          source: sourceSlot
            ? sourceSlot.classList.contains("fixed-slot")
              ? "fixed_slot"
              : "filled_slot"
            : "palette",
          slot_id: sourceSlot ? sourceSlot.dataset.slotId || null : null,
          fixed_letter: sourceSlot ? sourceSlot.getAttribute("data-fixed-letter") || null : null
        };
        logAction("drag_start", {
          kind: "letter",
          ...dragContext
        });
        if (onAfterDragStart) onAfterDragStart(letter, chip);
      });

      parkRoot.addEventListener("dragend", (ev) => {
        const chip = ev.target.closest(".token-chip.palette-token");
        if (!chip || !parkRoot.contains(chip)) return;
        const letter = getDragLetterRef ? getDragLetterRef() : chip.dataset.letter || "";
        logAction("drag_end", {
          kind: "letter",
          letter: letter || chip.dataset.letter || "",
          source: dragContext ? dragContext.source : null,
          slot_id: dragContext ? dragContext.slot_id : null,
          fixed_letter: dragContext ? dragContext.fixed_letter : null,
          dropped: dragDropped
        });
        setDragLetter(null);
        dragContext = null;
        dragDropped = false;
      });

      parkRoot.addEventListener("click", (ev) => {
        const chip = ev.target.closest(".token-chip.palette-token");
        if (!chip || !parkRoot.contains(chip)) return;
        if (isMapFindActive && isMapFindActive()) return;
        const sourceSlot = chip.closest(".task-slot");
        const source = sourceSlot
          ? sourceSlot.classList.contains("fixed-slot")
            ? "fixed_slot"
            : "filled_slot"
          : "palette";
        const letter = chip.dataset.letter || "";
        if (source === "palette") {
          logAction("palette_token_chip_click", { letter });
        } else {
          logAction("slot_token_chip_click", {
            letter,
            slot_id: sourceSlot ? sourceSlot.dataset.slotId || null : null,
            fixed_letter: sourceSlot ? sourceSlot.getAttribute("data-fixed-letter") || null : null
          });
        }
        if (!clickAssign || !isParkAssignableLetter(letter)) return;
        clickAssign.selectToken(
          {
            letter,
            source,
            slot_id: sourceSlot ? sourceSlot.dataset.slotId || null : null,
            fixed_letter: sourceSlot ? sourceSlot.getAttribute("data-fixed-letter") || null : null,
            chipEl: chip
          },
          logAction
        );
      });

      if (syncTokenDraggable) syncTokenDraggable();

      return { getDragContext, markDragDropped };
    };

    const wireParkSlotDropTargets = (opts) => {
      const {
        slotEls,
        logAction,
        renderTokenInSlot,
        syncPaletteDraggable,
        history,
        getDragContext,
        markDragDropped,
        hideEmptyActionNudge,
        getDropLetter,
        onAfterSlotDrop,
        clickAssign,
        isMapFindActive,
        isFillSlotActive,
        onFillSlotHint
      } = opts;

      const applyTokenToSlot = (slotEl, letter, meta = {}) => {
        if (slotEl.classList.contains("fixed-slot")) {
          logAction("drop_invalid", {
            slot_id: slotEl.dataset.slotId || null,
            reason: "fixed_slot",
            letter_attempt: letter || null,
            assign_mode: meta.assign_mode || "drag",
            drag_source: meta.drag_source || null,
            source_slot_id: meta.source_slot_id || null,
            source_fixed_letter: meta.source_fixed_letter || null
          });
          return false;
        }
        if (!isParkAssignableLetter(letter)) {
          logAction("drop_invalid", {
            slot_id: slotEl.dataset.slotId,
            reason: "not_a_letter",
            letter_attempt: letter || null,
            assign_mode: meta.assign_mode || "drag",
            drag_source: meta.drag_source || null,
            source_slot_id: meta.source_slot_id || null,
            source_fixed_letter: meta.source_fixed_letter || null
          });
          return false;
        }
        const prev = slotEl.dataset.letter || "";
        const next = isParkEmptyToken(letter) ? "" : letter;
        renderTokenInSlot(slotEl, next);
        syncPaletteDraggable();
        history.push({ type: "slot_drop", slotId: slotEl.dataset.slotId, prev, next });
        logAction("slot_drop", {
          slot_id: slotEl.dataset.slotId,
          from: prev,
          to: next,
          empty_token: isParkEmptyToken(letter),
          assign_mode: meta.assign_mode || "drag",
          drag_source: meta.drag_source || "palette",
          source_slot_id: meta.source_slot_id || null,
          source_fixed_letter: meta.source_fixed_letter || null
        });
        if (isParkEmptyToken(letter)) {
          logAction("empty_token_applied", {
            slot_id: slotEl.dataset.slotId,
            from: prev,
            assign_mode: meta.assign_mode || "drag",
            drag_source: meta.drag_source || "palette",
            source_slot_id: meta.source_slot_id || null,
            source_fixed_letter: meta.source_fixed_letter || null
          });
        }
        if (hideEmptyActionNudge) hideEmptyActionNudge("after_slot_drop", { slot_id: slotEl.dataset.slotId });
        if (onAfterSlotDrop) onAfterSlotDrop();
        return true;
      };

        slotEl.addEventListener("dragover", (ev) => {
          ev.preventDefault();
          slotEl.classList.add("drag-over");

        slotEl.addEventListener("dragleave", () => slotEl.classList.remove("drag-over"));
        slotEl.addEventListener("drop", (ev) => {
          ev.preventDefault();

          if (isFillSlotActive && isFillSlotActive()) return;
          const ctx = getDragContext ? getDragContext() : {};
          const droppedLetter = getDropLetter(ev);
          const ok = applyTokenToSlot(slotEl, droppedLetter, {
            assign_mode: "drag",
            drag_source: ctx.source || "palette",
            source_slot_id: ctx.slot_id || null,
            source_fixed_letter: ctx.fixed_letter || null

    /** Barvy palety + drop/klik na bílé hrany (ParkTask2/3). */
    const wireParkColorEdgeInteractions = (opts) => {

      const applyColorToEdge = (el, nextIdx, assignMode) => {

            edge_id: el.dataset.edgeId,
            reason: "no_color",

    /** ParkTask3: geometrie podgrafů (čáry mezi středy uzlů, širší zásah pro drop barev) */
    const pt3EdgeBar = (cx1, cy1, cx2, cy2, opts = {}) => {
      const r = opts.nodeR ?? 26;
      const extra = opts.hitExtra ?? 18;
      const h = opts.thickness ?? 26;
      const dx = cx2 - cx1;
      const dy = cy2 - cy1;
      const len = Math.hypot(dx, dy);
      const ux = dx / len;
      const uy = dy / len;
      const x1 = cx1 + ux * r;
      const y1 = cy1 + uy * r;
      const x2 = cx2 - ux * r;
      const y2 = cy2 - uy * r;
      const barLen = Math.hypot(x2 - x1, y2 - y1);
      const mx = (x1 + x2) / 2;
      const my = (y1 + y2) / 2;
      const ang = (Math.atan2(y2 - y1, x2 - x1) * 180) / Math.PI;
      const w = barLen + extra;
      const cls = opts.droppable ? "task-edge edge-drop-target" : "task-edge";
      const eid = opts.edgeId ? ` data-edge-id="${opts.edgeId}" data-edge-index="0"` : "";
      const bg = opts.bg || "#ffffff";
      return `<div class="${cls}"${eid} style="position:absolute;left:${mx - w / 2}px;top:${my - h / 2}px;width:${w}px;height:${h}px;transform:rotate(${ang}deg);transform-origin:center;box-sizing:border-box;background:${bg};border-radius:4px;z-index:1;"></div>`;
    };

    const pt3Node = (cx, cy, opts = {}) => {
      const s = opts.slotSize ?? 52;
      const left = cx - s / 2;
      const top = cy - s / 2;
      const st = `style="position:absolute;left:${left}px;top:${top}px;z-index:2;width:${s}px;height:${s}px;min-width:${s}px;min-height:${s}px;flex:0 0 ${s}px;box-sizing:border-box"`;

        return `<div class="task-slot fixed-slot" data-fixed-letter="${opts.letter}" ${st}>${tokenChip(opts.letter, true)}</div>`;

    };

      return `<div class="park-task3-graphs-wrap">

          <div class="prompt">
            <h2>Doplň plodiny a barvy cest do plánků.</h2>
            <p id="park-subtitle">Klikni na obrázek z nabídky pod mapou nebo z už vyplněných koleček a potom na prázdné kolečko, nebo obrázek přetáhni. Barevné čtverečky vedle nabídky klikni a potom klikni na bílou cestu, nebo barvu na cestu přetáhni. V jedné cestě může být každá plodina nejvýše jednou. Cestu si můžeš vyznačit v mapě klikáním na obrázky a barevné cesty.</p>

            <div id="park3-orange-hint" class="park-orange-hint task-hint-banner" role="status"></div>
          </div>

          <div class="park-stage">
            <div class="park-zoom digitool-task-surface">
            <div class="park-workspace park-workspace--task3">
              <div class="park-map-column">
                ${parkMapWithToolbar(1200)}
              </div>
              <div class="park-task3-graphs-column">
                ${buildParkTask3GraphsHtml()}
              </div>
            </div>

            <div class="token-palette-wrap">
              <div class="token-palette" id="token-palette">
                ${PALETTE_ORDER.map((l) => tokenChip(l, true)).join("")}
              </div>
              <div class="color-palette-col" id="park-color-palette" aria-label="Barvy hran">
                ${COLOR_PALETTE_HTML}
              </div>
            </div>
            </div>
          </div>

          <div id="park-nudge-banner" class="park-nudge-banner" role="alert">
            Doplň alespoň jednu plodinu nebo barvu na hranu.
          </div>

          <div class="park-controls">
            <button type="button" class="custom-task-btn" id="park-toggle-hint">Schovat nápovědu</button>
            <button type="button" class="custom-task-btn" id="park-undo">Krok zpět</button>
            <button type="button" class="custom-task-btn" id="park-reset">Začít znovu</button>
            <button type="button" class="custom-task-btn" id="park-finish">Další úloha</button>
          </div>
        </div>
      `,
      on_load: () => {
        setDigitoolSelfAssessmentUiLock(false);
        disposeDigitoolIdleTimer();
        const expected = PARK_TASK3_EXPECTED;
        const correctSolutionStrings = {};
        const hintBtn = document.getElementById("park-toggle-hint");
        const nudgeBannerEl = document.getElementById("park-nudge-banner");
        const slotEls = Array.from(document.querySelectorAll(".task-slot.drop-target"));
        const edgeEls = Array.from(document.querySelectorAll(".task-edge.edge-drop-target"));
        const colorEls = Array.from(document.querySelectorAll(".palette-color"));
        const { actionLogs, logAction } = createParkActionLogger({
          taskName: "ParkTask3"
        });

        const renderTokenInSlot = (slotEl, letter) => {
          slotEl.innerHTML = letter ? tokenChip(letter, true) : "";
          slotEl.dataset.letter = letter || "";
        };

        const getSnapshot = () => {
          const nodes = {};
          const edges = {};
          slotEls.forEach((el) => {
            nodes[el.dataset.slotId] = el.dataset.letter || "";
          });
          edgeEls.forEach((el) => {
            const idx = Number(el.dataset.edgeIndex || "0");
            edges[el.dataset.edgeId] = edgeNames[idx];
          });
          return { nodes, edges };
        };

        const history = [];
        let dragLetter = null;
        let dragColorIdx = null;

        const parkRoot = document.querySelector(".park-task-root");
        const clickAssign = createParkClickAssignState(parkRoot);
        let hints = null;
        let mapSpotlightActive = false;
        let ghostHintFromGhostUsed = false;
        const clearOrangeHints = () => {
          if (hints) {
            hints.dismissVisuals();
            return;
          }
          parkRoot.querySelectorAll(".park-orange-hint").forEach((el) => {
            el.classList.remove("is-visible");
            el.textContent = "";
            el.style.removeProperty("display");
          });
          clearParkPlayerCheckMarks(parkRoot);
        };
        const syncPaletteDraggable = () => {
          parkRoot.querySelectorAll(".token-chip.palette-token").forEach((el) => {
            el.draggable = !hints || hints.allowsPaletteDrag();
          });
        };

        let mapUi;
        const applyMapSpotlightLetter = (letter, source) => {
          if (!mapSpotlightActive || !isParkCropLetter(letter)) return;
          mapUi.setTurquoiseLetter(letter);
          clearOrangeHints();
          clickAssign.clearSelection(null, null);
          syncPaletteDraggable();
          logAction("park_orange_mapfind_resolve", { letter, source });
        };
        mapUi = attachParkMapInteractions(parkRoot, logAction);

        let slotDropApi = null;
        let edgeColorApi = null;
        hints = createParkGuidedHints({
          parkRoot,
          logAction,
          expected,
          orangeHintEl: document.getElementById("park3-orange-hint"),
          markGhostUsed: () => {
            ghostHintFromGhostUsed = true;
            mapSpotlightActive = false;
          },
          clearClickSelection: () => clickAssign.clearSelection(null, null),
          onSyncDrag: syncPaletteDraggable
        });
        const hintBridge = hints.hintBridge;

        wireParkGhostMinimized(logAction, hintBridge);

        const showEmptyActionNudge = (source) => {
          if (!nudgeBannerEl) return;
          nudgeBannerEl.classList.add("is-visible");
          logAction("nudge_empty_action_show", { source });
        };

        const hideEmptyActionNudge = (source, extra = {}) => {
          if (!nudgeBannerEl || !nudgeBannerEl.classList.contains("is-visible")) return;
          nudgeBannerEl.classList.remove("is-visible");
          logAction("nudge_empty_action_hide", { source, ...extra });
        };

        parkRoot.addEventListener("click", (ev) => {
          if (!mapSpotlightActive) return;
          const chip = ev.target.closest(".palette-token");
          const slot = ev.target.closest(".task-slot");
          if (!chip && !slot) return;
          let letter = "";
          if (chip) letter = chip.dataset.letter || "";
          else if (slot) {
            letter = slot.dataset.letter || slot.getAttribute("data-fixed-letter") || "";
            if (!letter) {
              const tl = slot.querySelector(".token-letter");
              if (tl) letter = (tl.textContent || "").trim();
            }
          }
          if (isParkCropLetter(letter)) applyMapSpotlightLetter(letter, chip ? "palette" : "slot");
          else if (chip || slot) {
            logAction("park_mapfind_click_no_highlight", {
              source: chip ? "palette" : "slot",
              slot_id: slot ? slot.dataset.slotId || null : null,
              letter_attempt: letter || null
            });
          }
        });

        const dragApi = wireParkVertexDragSources(parkRoot, {
          logAction,
          getDragLetterRef: () => dragLetter,
          setDragLetter: (v) => {
            dragLetter = v;
          },
          setDragColorIdx: (v) => {
            dragColorIdx = v;
          },
          syncTokenDraggable: syncPaletteDraggable,
          clickAssign,
          isMapFindActive: () => mapSpotlightActive
        });

        slotDropApi = wireParkSlotDropTargets({
          slotEls,
          logAction,
          renderTokenInSlot,
          syncPaletteDraggable,
          history,
          getDragContext: dragApi.getDragContext,
          markDragDropped: dragApi.markDragDropped,
          hideEmptyActionNudge,
          getDropLetter: (ev) => {
            const raw = (ev.dataTransfer && ev.dataTransfer.getData("text/plain")) || "";
            return raw.startsWith("color:") ? "" : raw || dragLetter;
          },
          clickAssign,
          isMapFindActive: () => mapSpotlightActive,
          isFillSlotActive: () => hints.isWandActive(),
          onAfterSlotDrop: () => hints.notifyMove("slot_drop"),
          onFillSlotHint: (slotEl) => hints.tryWandSlot(slotEl)
        });
        hints.setAppliers(
          (slotEl, letter, meta) => slotDropApi.applyTokenToSlot(slotEl, letter, meta),
          (edgeEl, idx, modeName) => edgeColorApi.applyColorToEdge(edgeEl, idx, modeName)
        );

        edgeColorApi = wireParkColorEdgeInteractions({
          colorEls,
          edgeEls,
          logAction,
          history,
          setDragLetter: (v) => {
            dragLetter = v;
          },
          getDragColorIdx: () => dragColorIdx,
          setDragColorIdx: (v) => {
            dragColorIdx = v;
          },
          clickAssign,
          hideEmptyActionNudge,
          isFillSlotActive: () => hints.isWandActive(),
          onFillEdgeHint: (edgeEl) => hints.tryWandEdge(edgeEl),
          onAfterEdgeAssign: () => hints.notifyMove("edge_change")
        });

        hintBtn.addEventListener("click", () => {
          logAction("park_toggle_hint_click", {
            ghost_hint_used_before: !!ghostHintFromGhostUsed,
            task_name: "ParkTask3"
          });
          clearOrangeHints();
          mapUi.clearTurquoise();
          logAction("park_map_turquoise_cleared", { source: "park_toggle_hint" });
          mapSpotlightActive = false;
          clickAssign.clearSelection(null, null);
          syncPaletteDraggable();
          hintBtn.textContent = "Schovat nápovědu";
          if (!ghostHintFromGhostUsed) {
            revealParkOrangeHint(document.getElementById("park3-orange-hint"), PARK_ORANGE_MSG_USE_GHOST);
            logAction("park_hide_hint_prompt_use_ghost", {});
            return;
          }
          logAction("park_hide_hint_cleared_visuals", {});
        });

        document.getElementById("park-undo").addEventListener("click", () => {
          logAction("park_undo_button_click", { task_name: "ParkTask3" });
          if (history.length === 0) {
            logAction("undo_clicked_while_no_history");
            showEmptyActionNudge("undo_no_history");
            return;
          }
          const last = history.pop();
          if (last.type === "slot_drop") {
            const slotEl = document.querySelector(`[data-slot-id="${last.slotId}"]`);
            if (slotEl) {
              renderTokenInSlot(slotEl, last.prev);
              syncPaletteDraggable();
            }
          } else if (last.type === "edge_change") {
            const edgeEl = document.querySelector(`[data-edge-id="${last.edgeId}"]`);
            if (edgeEl) {
              edgeEl.dataset.edgeIndex = String(last.prev);
              edgeEl.style.background = edgePalette[last.prev];
            }
          }
          logAction("undo", { reverted: last.type });
          hints.notifyMove("undo");
        });

        document.getElementById("park-reset").addEventListener("click", () => {
          logAction("park_reset_button_click", { task_name: "ParkTask3" });
          if (history.length === 0) {
            logAction("reset_clicked_while_no_history");
            showEmptyActionNudge("reset_no_history");
            return;
          }
          slotEls.forEach((slotEl) => renderTokenInSlot(slotEl, ""));
          edgeEls.forEach((el) => {
            el.dataset.edgeIndex = "0";
            el.style.background = edgePalette[0];
          });
          history.length = 0;
          logAction("reset_all");
          hints.notifyMove("reset");
        });

        wireParkFinishWithSelfAssessment({
          finishButton: document.getElementById("park-finish"),
          idPrefix: "park3-",
          feedbackContinueLabel: "Ukončit úlohu",
          logAction,
          blockUntilGhostIntroAnswered: null,
          getSnapshot,
          expected,
          renderTokenInSlot,
          buildTrialData: () => ({
            task_name: "ParkTask3",
            action_logs: actionLogs
          })
        });

        setupDigitoolIdleGhostPrompt({
          logAction,
          isIdleAllowed: () => {
            const bubble = document.getElementById("ghost-bubble");
            return (
              !document.body.classList.contains("digitool-self-assessment-lock") &&
              bubble &&
              !bubble.classList.contains("degree-self-assessment-wide")
            );
          },
          ghostText: document.getElementById("ghost-text"),
          ghostButtons: document.getElementById("ghost-buttons"),
          ghostBubble: document.getElementById("ghost-bubble"),
          ghostUI: document.getElementById("ghost-ui"),
          defaultGhostHtml: "Pokud budeš potřebovat nápovědu,<br>klikni na mě.",
          defaultGhostButtonsHtml: "",
          onRequestHelp: () => {
            document.getElementById("ghost-character").click();
          }
        });

        logAction("task_loaded", { task_name: "ParkTask3" });
      }
    };

    jsPsych.run(
      DigitoolActionLogStore.bindTrialOnFinish(
        DIGITOOL_INCLUDE_PARK_TASK_3
          ? [ParkTask1, ParkTask2, ParkTask3]
          : [ParkTask1, ParkTask2],
        respondentIdFromUrl,
        "park"
      )
    );
  </script>
</body>
</html>
