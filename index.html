<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f2a44" />
  <meta name="application-name" content="DigiTool" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>DigiTool</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f4f9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .wrap {
      width: min(980px, 100%);
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      padding: 24px;
    }
    h1 {
      margin: 0 0 8px 0;
      text-align: center;
      font-size: 30px;
      color: #1f2a44;
    }
    .respondent-id {
      text-align: center;
      color: #4b5563;
      font-weight: 700;
      margin: 0 0 18px 0;
    }
    .subtitle {
      margin: 0 0 24px 0;
      text-align: center;
      color: #555;
      font-size: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(220px, 1fr));
      gap: 20px;
    }
    .card {
      border: 2px solid #d7d7d7;
      border-radius: 12px;
      padding: 14px;
      background: #fff;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .preview {
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #ccc;
    }
    .label {
      text-align: center;
      font-weight: 700;
      color: #1f2a44;
      font-size: 18px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .open-btn {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }
    .open-euler { background: #2f6ea7; }
    .open-euler:hover { background: #255c8c; }
    .open-degree { background: #2b7a4b; }
    .open-degree:hover { background: #22653e; }
    .open-park { background: #15803d; }
    .open-park:hover { background: #126b33; }
    .card.locked {
      filter: grayscale(1);
      opacity: 0.7;
      border-color: #b0b0b0;
    }
    .card.locked .open-btn {
      background: #8f8f8f !important;
      cursor: not-allowed;
    }

    #intro-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 2000;
      display: none;
    }
    #ghost-ui {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 2200;
      display: flex;
      align-items: flex-end;
      transform-origin: bottom left;
      transform: scale(0.6);
      transition: transform 0.35s ease;
    }
    #ghost-character {
      text-align: center;
      animation: float 3s ease-in-out infinite;
      cursor: pointer;
      user-select: none;
    }
    #ghost-bubble {
      margin-left: -10px;
      margin-bottom: 40px;
      position: relative;
      background: #fff;
      border: 3px solid #007bff;
      border-radius: 20px;
      padding: 18px;
      min-width: 320px;
      max-width: min(420px, 90vw);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #ghost-bubble.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .ghost-text {
      font-size: 17px;
      font-weight: 700;
      color: #1f2a44;
      margin-bottom: 12px;
      text-align: center;
      line-height: 1.35;
    }
    #ghost-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .ghost-btn {
      margin-top: 4px;
      padding: 10px 15px;
      font-size: 14px;
      border-radius: 8px;
      border: none;
      background: #007bff;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    .ghost-btn:hover { background: #0056d2; }
    .ghost-btn.ghost-btn--back {
      background: #6c757d;
    }
    .ghost-btn.ghost-btn--back:hover {
      background: #5a6268;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @media (max-width: 1100px) {
      .grid { grid-template-columns: repeat(2, minmax(260px, 1fr)); }
    }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
    }
    .thanks-screen {
      text-align: center;
      padding: 30px 10px 20px;
    }
    .thanks-screen h2 {
      margin: 0 0 10px 0;
      color: #1f2a44;
      font-size: 34px;
    }
    .thanks-screen p {
      margin: 0;
      color: #4b5563;
      font-size: 18px;
      line-height: 1.5;
    }
    .local-export-btn {
      position: fixed;
      left: 0;
      top: 0;
      width: 1px;
      height: 1px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }
    #local-export-notice {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3000;
      max-width: min(520px, calc(100% - 32px));
      padding: 12px 16px;
      border-radius: 10px;
      background: #1f2a44;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #local-export-notice.visible {
      opacity: 1;
    }
    #main-title,
    .thanks-screen h2 {
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .local-export-hold-hint {
      display: none;
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3000;
      max-width: min(520px, calc(100% - 32px));
      padding: 12px 16px;
      border-radius: 10px;
      background: #1f2a44;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      pointer-events: none;
    }
    .local-export-hold-hint.visible {
      display: block;
    }
  </style>
</head>

  <script src="digitool-idle-prompt.js"></script>
  <script>
    const SESSION_KEY = 'digitool_active_session';
    const RESULTS_KEY = 'digitool_results';
    const ARCHIVE_KEY = 'digitool_archive';
    /** Po nasazení Google Apps Script vložte sem URL končící na /exec (viz github-a-google-disk-navod.txt). */
    const GOOGLE_DRIVE_UPLOAD_URL = 'https://script.google.com/macros/s/AKfycbyANMdl655_EgkUClCXONgoYJszYTA9t3k3Ed-JYhLoUYvfM_95sQasW_Er1oJKQCI/exec';

    const introOverlay = document.getElementById('intro-overlay');
    const ghostUI = document.getElementById('ghost-ui');
    const ghostCharacter = document.getElementById('ghost-character');
    const ghostBubble = document.getElementById('ghost-bubble');
    const ghostText = document.getElementById('ghost-text');
    const ghostButtons = document.getElementById('ghost-buttons');
    const respondentIdLabel = document.getElementById('respondent-id');

    const readJSON = (key, fallback) => {
      try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }
      catch (e) { return fallback; }
    };
    const writeJSON = (key, value) => localStorage.setItem(key, JSON.stringify(value));

    const readStoredValue = (key) => {
      let raw = null;
      try { raw = localStorage.getItem(key); }
      catch (e) { return { _error: String(e && e.message ? e.message : e) }; }
      if (raw == null) return null;
      try { return JSON.parse(raw); }
      catch (e) { return { _parse_error: String(e && e.message ? e.message : e), _raw: raw }; }
    };

    const showLocalExportNotice = (message) => {
      const notice = document.getElementById('local-export-notice');
      if (!notice) return;
      notice.textContent = message;
      notice.classList.add('visible');
      clearTimeout(showLocalExportNotice._timer);
      showLocalExportNotice._timer = setTimeout(() => notice.classList.remove('visible'), 4500);
    };

    const downloadLocalData = () => {
      const results = readStoredValue(RESULTS_KEY);
      const archive = readStoredValue(ARCHIVE_KEY);
      const sessionSnap = readStoredValue(SESSION_KEY);
      const exportedAt = new Date();
      const payload = {
        exported_at: exportedAt.toISOString(),
        digitool_results: results,
        digitool_archive: archive,
        digitool_active_session: sessionSnap
      };
      const pad = (n) => String(n).padStart(2, '0');
      const stamp = `${exportedAt.getFullYear()}${pad(exportedAt.getMonth() + 1)}${pad(exportedAt.getDate())}_${pad(exportedAt.getHours())}${pad(exportedAt.getMinutes())}${pad(exportedAt.getSeconds())}`;
      const respondentId = sessionSnap && sessionSnap.respondent_id
        ? String(sessionSnap.respondent_id).replace(/[^\w.-]+/g, '_')
        : 'bez_id';
      const filename = `DigiTool_local_${respondentId}_${stamp}.json`;
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      const resultsEmpty = results == null || (typeof results === 'object' && !Array.isArray(results) && Object.keys(results).length === 0);
      const archiveEmpty = archive == null || (Array.isArray(archive) && archive.length === 0);
      showLocalExportNotice(
        resultsEmpty && archiveEmpty
          ? 'V prohlížeči nejsou uložené výsledky ani archiv. Soubor byl přesto stažen.'
          : 'Lokální data byla stažena do souboru JSON.'
      );
    };

    const uploadJsonToGoogleDrive = async (filename, jsonString) => {
      if (!GOOGLE_DRIVE_UPLOAD_URL) return false;
      const body = 'payload=' + encodeURIComponent(JSON.stringify({ filename, content: jsonString }));
      try {
        const res = await fetch(GOOGLE_DRIVE_UPLOAD_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=utf-8' },
          body
        });
        const text = await res.text();
        if (text.indexOf('"ok":false') !== -1 || text.indexOf('"ok": false') !== -1) return false;
        if (text.indexOf('"ok":true') !== -1 || text.indexOf('"ok": true') !== -1 || res.ok) return true;
      } catch (err) {
        console.warn('DigiTool upload fetch:', err);
      }
      return false;
    };

    const todayToken = () => {
      const d = new Date();
      const yy = String(d.getFullYear()).slice(-2);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yy}${mm}${dd}`;
    };

    const createRespondentId = () => {
      const token = todayToken();
      const counterKey = `digitool_daily_counter_${token}`;
      const last = parseInt(localStorage.getItem(counterKey) || '0', 10);
      const next = last + 1;
      localStorage.setItem(counterKey, String(next));
      return `${token}_${String(next).padStart(2, '0')}`;
    };

    const addSessionLog = (action, detail = {}) => {
      session.logs.push({ time: Date.now(), action, ...detail });
      writeJSON(SESSION_KEY, session);
    };
    const showThanksScreen = (uploadOk = true) => {
      disposeDigitoolIdleTimer();
      const mainWrap = document.getElementById('main-wrap');
      const detail = uploadOk
        ? 'Děkujeme za vyplnění všech tří úloh.<br>Data byla úspěšně uložena.'
        : 'Děkujeme za vyplnění všech tří úloh.<br>Nahrání na Google Disk se nezdařilo – požádej učitele o kontrolu nastavení.';
      mainWrap.innerHTML = `
        <div class="thanks-screen">
          <h2>Děkujeme!</h2>
          <p>${detail}</p>
        </div>
      `;
      introOverlay.style.display = 'none';
      hideBubble();
      ghostUI.style.display = 'none';
    };


    const setGhostCentered = () => {
      ghostUI.style.left = '50%';
      ghostUI.style.top = '50%';
      ghostUI.style.bottom = 'auto';
      ghostUI.style.transform = 'translate(-50%, -50%) scale(1)';
    };
    const setGhostMinimized = () => {
      ghostUI.style.left = '20px';
      ghostUI.style.top = '20px';
      ghostUI.style.bottom = 'auto';
      ghostUI.style.transform = 'scale(0.6)';
    };
    const showBubble = () => ghostBubble.classList.add('visible');
    const hideBubble = () => ghostBubble.classList.remove('visible');

    const renderGhostButtons = (items) => {
      ghostButtons.innerHTML = '';
      items.forEach((item) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'ghost-btn';
        btn.textContent = item.label;
        btn.addEventListener('click', item.onClick);
        ghostButtons.appendChild(btn);
      });
    };

    const appendIntroBackButton = (fromStep, toStep) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ghost-btn ghost-btn--back';
      btn.textContent = 'Krok zpět';
      btn.addEventListener('click', () => {
        addSessionLog('intro_back_clicked', { from_step: fromStep, to_step: toStep });
        if (fromStep === 3) session.demographics.gender = null;
        renderIntroStep(toStep);
      });
      ghostButtons.appendChild(btn);
    };

    const renderIntroStep = (step) => {
      session.intro_step = step;
      writeJSON(SESSION_KEY, session);
      showBubble();
      if (step === 1) {
        ghostText.textContent = 'Ahoj! Budu tě dnes provázet úlohami. Než začneme, potřebuji tvůj souhlas. Tvým úkolem bude pomoct nám ve zjistit, jak žáci řeší problémy. Nejde o žádné zkoušení a na tvé známky ve škole to nebude mít vůbec žádný vliv. Navíc, pokud bys už nechtěl/a pokračovat, můžeš to kdykoliv vypnout a skončit. Souhlasíš s účastí?';
        renderGhostButtons([{
          label: 'Ano, souhlasím.',
          onClick: () => {
            session.demographics.research_consent = true;
            addSessionLog('research_consent_given', { value: true, label: 'Ano, souhlasím.' });
            renderIntroStep(2);
          }
        }]);
      } else if (step === 2) {
        ghostText.textContent = 'Do jaké třídy chodíš?';
        renderGhostButtons(
          [2, 3, 4, 5, 6, 7, 8, 9].map((n) => ({
            label: `${n}.`,
            onClick: () => {
              session.demographics.class = String(n);
              addSessionLog('demography_class_selected', { value: String(n) });
              renderIntroStep(3);
            },
          }))
        );
        appendIntroBackButton(2, 1);
      } else {
        ghostText.textContent = 'Jsi dívka nebo chlapec?';
        renderGhostButtons([
          { label: 'Dívka', onClick: () => { session.demographics.gender = 'divka'; finishIntro(); } },
          { label: 'Chlapec', onClick: () => { session.demographics.gender = 'chlapec'; finishIntro(); } }
        ]);
        appendIntroBackButton(3, 2);
      }
      writeJSON(SESSION_KEY, session);
    };

    const showTaskChooserGhost = () => {
      const { eDone, dDone, pDone } = getProgress();
      const doneCount = [eDone, dDone, pDone].filter(Boolean).length;
      if (eDone && dDone && pDone) {
        ghostText.textContent = 'Vyčkejte, až se data odešlou na server.';
      } else if (doneCount >= 1 && doneCount < 3) {
        ghostText.textContent = 'Skvělé, úlohu už máš vyřešenou! Otevři další úlohu.';
      } else {
        ghostText.textContent = 'Vyber si úlohu, kterou začneš.';
      }
      renderGhostButtons([]);
      showBubble();
      ghostUI.style.transform = 'scale(1)';
      addSessionLog('ghost_task_choice_opened');
    };

    const finishIntro = () => {
      session.intro_done = true;
      addSessionLog('demography_gender_selected', { value: session.demographics.gender });
      addSessionLog('intro_completed', { demographics: session.demographics });
      writeJSON(SESSION_KEY, session);
      introOverlay.style.display = 'none';
      document.body.style.overflow = '';
      setGhostMinimized();
      hideBubble();
      setupHubIdleIfAllowed();
    };

    const setupHubIdleIfAllowed = () => {
      disposeDigitoolIdleTimer();
      if (!session.intro_done || session.downloaded) return;
      const { eDone, dDone, pDone } = getProgress();
      if (eDone && dDone && pDone) return;
      setupDigitoolIdleGhostPrompt({
        logAction: (action, detail = {}) => addSessionLog(action, detail),
        isIdleAllowed: () => {
          if (!session.intro_done || session.downloaded) return false;
          if (!document.getElementById('main-title')) return false;
          const progress = getProgress();
          return !(progress.eDone && progress.dDone && progress.pDone);
        },
        ghostText,
        ghostButtons,
        ghostBubble,
        ghostUI,
        defaultGhostHtml: '',
        defaultGhostButtonsHtml: '',
        onRequestHelp: () => showTaskChooserGhost()
      });
    };

    const resultsMatchSession = (results) =>
      results.respondent_id === session.respondent_id ||
      results.euler?.respondent_id === session.respondent_id ||
      results.degree?.respondent_id === session.respondent_id ||
      results.park?.respondent_id === session.respondent_id;

    const getProgress = () => {
      const results = readJSON(RESULTS_KEY, {});
      const eDone = results.euler && results.euler.respondent_id === session.respondent_id;
      const dDone = results.degree && results.degree.respondent_id === session.respondent_id;
      const pDone = results.park && results.park.respondent_id === session.respondent_id;
      return { eDone, dDone, pDone, results };
    };

    const stripNestedRespondentId = (taskResult) => {
      if (!taskResult || typeof taskResult !== 'object') return taskResult;
      const out = { ...taskResult };
      delete out.respondent_id;
      return out;
    };

    const collectTaskActionLogs = (taskResult) => {
      if (!taskResult || typeof taskResult !== 'object') return [];
      if (Array.isArray(taskResult.action_logs) && taskResult.action_logs.length > 0) {
        return taskResult.action_logs;
      }
      const trials = Array.isArray(taskResult.trials) ? taskResult.trials : [];
      return trials.flatMap((trial) =>
        Array.isArray(trial?.action_logs) ? trial.action_logs : []
      );
    };

    const buildAllActionLogs = (results) => {
      const blocks = [
        { block: 'euler', logs: collectTaskActionLogs(results.euler) },
        { block: 'degree_sequence', logs: collectTaskActionLogs(results.degree) },
        { block: 'park', logs: collectTaskActionLogs(results.park) }
      ];
      const merged = [];
      blocks.forEach(({ block, logs }) => {
        logs.forEach((entry) => {
          merged.push({
            ...entry,
            task_block: entry.task_block || block
          });
        });
      });
      merged.sort((a, b) => (a.time || 0) - (b.time || 0));
      return merged;
    };

    const readSessionActionLogs = (respondentId, scope) => {
      try {
        const raw = sessionStorage.getItem(
          `digitool_action_logs_${respondentId || 'anon'}_${scope}`
        );
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return [];
      }
    };

    const applyTaskAvailability = () => {
      const mainTitle = document.getElementById('main-title');
      const eulerBtn = document.getElementById('open-euler');
      const degreeBtn = document.getElementById('open-degree');
      const parkBtn = document.getElementById('open-park');
      const eulerCard = eulerBtn.closest('.card');
      const degreeCard = degreeBtn.closest('.card');
      const parkCard = parkBtn.closest('.card');
      const { eDone, dDone, pDone } = getProgress();

      eulerBtn.disabled = false;
      degreeBtn.disabled = false;
      parkBtn.disabled = false;
      eulerCard.classList.remove('locked');
      degreeCard.classList.remove('locked');
      parkCard.classList.remove('locked');

      if (eDone && dDone && pDone) {
        mainTitle.textContent = 'Vyčkejte, až se data odešlou na server.';
        eulerBtn.disabled = true;
        degreeBtn.disabled = true;
        parkBtn.disabled = true;
        eulerCard.classList.add('locked');
        degreeCard.classList.add('locked');
        parkCard.classList.add('locked');
        return;
      }

      const doneCount = [eDone, dDone, pDone].filter(Boolean).length;
      if (doneCount >= 1) {
        mainTitle.textContent = 'Pokračuj na další úlohu.';
      } else {
        mainTitle.textContent = 'Vyber si, jakou úlohou začneš.';
      }

      if (eDone) {
        eulerBtn.disabled = true;
        eulerCard.classList.add('locked');
      }
      if (dDone) {
        degreeBtn.disabled = true;
        degreeCard.classList.add('locked');
      }
      if (pDone) {
        parkBtn.disabled = true;
        parkCard.classList.add('locked');
      }
    };

    const uploadSessionSnapshot = async () => {
      const { eDone, dDone, pDone, results } = getProgress();
      const doneCount = [eDone, dDone, pDone].filter(Boolean).length;
      if (session.downloaded) {
        if (doneCount === 3) showThanksScreen(true);
        return;
      }
      if (doneCount === 0) return;
      const alreadySent = (session.uploaded_task_count || 0) >= doneCount && !session.upload_failed;
      if (alreadySent || uploadSessionSnapshot._busy) return;
      uploadSessionSnapshot._busy = true;
      try {
        const completedTasks = [];
        if (eDone) completedTasks.push('euler');
        if (dDone) completedTasks.push('degree');
        if (pDone) completedTasks.push('park');
        const allActionLogs = buildAllActionLogs(results);
        const combined = {
          respondent_id: session.respondent_id,
          started_at: session.started_at,
          first_task: session.first_task || null,
          demographics: session.demographics,
          hub_logs: session.logs,
          all_action_logs: allActionLogs,
          loglist: allActionLogs,
          euler: eDone ? stripNestedRespondentId(results.euler) : null,
          degree_sequence: dDone ? stripNestedRespondentId(results.degree) : null,
          park: pDone ? stripNestedRespondentId(results.park) : null,
          completed_tasks: completedTasks,
          tasks_completed_count: doneCount,
          last_completed_task: session.last_completed_task || null,
          all_tasks_completed: doneCount === 3,
          exported_at: new Date().toISOString()
        };
        const filename = `DigiTool_${session.respondent_id}.json`;
        const jsonString = JSON.stringify(combined, null, 2);
        let uploadOk = false;
        if (GOOGLE_DRIVE_UPLOAD_URL) {
          uploadOk = await uploadJsonToGoogleDrive(filename, jsonString);
          addSessionLog(uploadOk ? 'combined_upload_ok' : 'combined_upload_failed', {
            filename,
            tasks_completed_count: doneCount,
            last_completed_task: session.last_completed_task || null
          });
        } else {
          console.warn('GOOGLE_DRIVE_UPLOAD_URL není nastavená – data jen v prohlížeči.');
          addSessionLog('combined_upload_skipped_no_url', { tasks_completed_count: doneCount });
        }
        const archive = readJSON(ARCHIVE_KEY, []);
        const list = Array.isArray(archive) ? archive : [];
        const existingIndex = list.findIndex((item) => item && item.respondent_id === session.respondent_id);
        if (existingIndex >= 0) list[existingIndex] = combined;
        else list.push(combined);
        writeJSON(ARCHIVE_KEY, list);
        if (!GOOGLE_DRIVE_UPLOAD_URL || uploadOk) {
          session.uploaded_task_count = doneCount;
          session.upload_failed = false;
        } else {
          session.upload_failed = true;
        }
        if (doneCount === 3) session.downloaded = true;
        writeJSON(SESSION_KEY, session);
        if (doneCount === 3) showThanksScreen(uploadOk);
      } finally {
        uploadSessionSnapshot._busy = false;
      }
    };

    const openTask = (fileName, taskKey) => {
      if (!session.intro_done) {
        addSessionLog('task_open_blocked_before_intro', { task: taskKey });
        return;
      }
      const { eDone, dDone, pDone } = getProgress();
      if (
        (taskKey === 'euler' && eDone) ||
        (taskKey === 'degree' && dDone) ||
        (taskKey === 'park' && pDone)
      ) {
        addSessionLog('task_open_blocked_already_completed', { task: taskKey });
        return;
      }
      if (!session.first_task) {
        session.first_task = taskKey;
        addSessionLog('first_task_selected', { task: taskKey });
      }
      addSessionLog('task_open_requested', { task: taskKey, file: fileName });
      const baseUrl = new URL('.', window.location.href);
      const taskUrl = new URL(fileName, baseUrl);
      taskUrl.searchParams.set('rid', session.respondent_id);
      window.location.href = taskUrl.toString();
    };

    const urlParams = new URLSearchParams(window.location.search);
    const completed = urlParams.get('completed');
    const isReturningFromTask = completed === 'euler' || completed === 'degree' || completed === 'park';

    const makeNewSession = () => ({
      respondent_id: createRespondentId(),
      started_at: new Date().toISOString(),
      intro_step: 1,
      intro_done: false,
      downloaded: false,
      uploaded_task_count: 0,
      upload_failed: false,
      last_completed_task: null,
      first_task: null,
      demographics: { class: null, gender: null, research_consent: null },
      logs: []
    });

    let session = readJSON(SESSION_KEY, null);
    const currentResults = readJSON(RESULTS_KEY, {});
    const hasEulerForSession = !!(session && currentResults.euler && currentResults.euler.respondent_id === session.respondent_id);
    const hasDegreeForSession = !!(session && currentResults.degree && currentResults.degree.respondent_id === session.respondent_id);
    const hasParkForSession = !!(session && currentResults.park && currentResults.park.respondent_id === session.respondent_id);
    const completedTaskCount = [hasEulerForSession, hasDegreeForSession, hasParkForSession].filter(Boolean).length;
    const inProgressSession = completedTaskCount > 0 && completedTaskCount < 3;

    if (!session || session.downloaded || (!isReturningFromTask && !inProgressSession)) {
      session = makeNewSession();
      writeJSON(SESSION_KEY, session);
      writeJSON(RESULTS_KEY, {});
    }
    respondentIdLabel.textContent = '';

    if (completed === 'euler' || completed === 'degree' || completed === 'park') {
      // Fallback: pokud se vrátíme z úlohy a výsledky nejsou správně navázané na session,
      // nastavíme minimální "completed" záznam, aby se zobrazila pokračovací stránka.
      const resultsSnapshot = readJSON(RESULTS_KEY, {});
      if (completed === 'euler') {
        const hasValidEuler = !!(resultsSnapshot.euler && resultsSnapshot.euler.respondent_id === session.respondent_id);
        if (!hasValidEuler) {
          const recovered = readSessionActionLogs(session.respondent_id, 'euler');
          resultsSnapshot.euler = {
            respondent_id: session.respondent_id,
            completed_at: new Date().toISOString(),
            action_logs: recovered.length ? recovered : resultsSnapshot.euler?.action_logs || [],
            trials: resultsSnapshot.euler?.trials || []
          };
          writeJSON(RESULTS_KEY, resultsSnapshot);
        }
      } else if (completed === 'degree') {
        const hasValidDegree = !!(resultsSnapshot.degree && resultsSnapshot.degree.respondent_id === session.respondent_id);
        if (!hasValidDegree) {
          const recovered = readSessionActionLogs(session.respondent_id, 'degree');
          resultsSnapshot.degree = {
            respondent_id: session.respondent_id,
            completed_at: new Date().toISOString(),
            action_logs: recovered.length ? recovered : resultsSnapshot.degree?.action_logs || [],
            trials: resultsSnapshot.degree?.trials || []
          };
          writeJSON(RESULTS_KEY, resultsSnapshot);
        }
      } else if (completed === 'park') {
        const hasValidPark = !!(resultsSnapshot.park && resultsSnapshot.park.respondent_id === session.respondent_id);
        if (!hasValidPark) {
          const recovered = readSessionActionLogs(session.respondent_id, 'park');
          resultsSnapshot.park = {
            respondent_id: session.respondent_id,
            completed_at: new Date().toISOString(),
            action_logs: recovered.length ? recovered : resultsSnapshot.park?.action_logs || [],
            trials: resultsSnapshot.park?.trials || []
          };
          writeJSON(RESULTS_KEY, resultsSnapshot);
        }
      }
    }

    if (completed === 'euler' || completed === 'degree' || completed === 'park') {
      session.last_completed_task = completed;
      addSessionLog('task_returned_to_hub', { task: completed });
      history.replaceState({}, '', 'index.html');
    }

    document.getElementById('download-local-data').addEventListener('click', downloadLocalData);
    const localExportHoldHint = document.getElementById('local-export-hold-hint');
    const localExportHoldRoot = document.getElementById('main-wrap');
    const LOCAL_EXPORT_HOLD_MS = 1500;
    let localExportHoldTimer = 0;
    let localExportHoldReady = false;
    let localExportHoldPointer = null;
    const isLocalExportHoldTarget = (node) => !!(node && node.closest && node.closest('#main-title, .thanks-screen h2'));
    const resetLocalExportHold = () => {
      clearTimeout(localExportHoldTimer);
      localExportHoldTimer = 0;
      localExportHoldReady = false;
      localExportHoldPointer = null;
      localExportHoldHint.classList.remove('visible');
    };
    localExportHoldRoot.addEventListener('pointerdown', (e) => {
      if (localExportHoldPointer != null) return;
      if (!isLocalExportHoldTarget(e.target)) return;
      if (e.button != null && e.button !== 0) return;
      e.preventDefault();
      localExportHoldPointer = e.pointerId;
      localExportHoldReady = false;
      try { localExportHoldRoot.setPointerCapture(e.pointerId); } catch (err) {}
      clearTimeout(localExportHoldTimer);
      localExportHoldTimer = setTimeout(() => {
        localExportHoldReady = true;
        localExportHoldHint.classList.add('visible');
        if (navigator.vibrate) navigator.vibrate(30);
      }, LOCAL_EXPORT_HOLD_MS);
    });
    localExportHoldRoot.addEventListener('pointerup', (e) => {
      if (e.pointerId !== localExportHoldPointer) return;
      const shouldDownload = localExportHoldReady;
      resetLocalExportHold();
      if (shouldDownload) document.getElementById('download-local-data').click();
    });
    localExportHoldRoot.addEventListener('pointercancel', (e) => {
      if (e.pointerId !== localExportHoldPointer) return;
      resetLocalExportHold();
    });
    localExportHoldRoot.addEventListener('contextmenu', (e) => {
      if (isLocalExportHoldTarget(e.target)) e.preventDefault();
    });
    document.addEventListener('keydown', (e) => {
      if (e.repeat || e.isComposing) return;
      if (e.ctrlKey && e.shiftKey && !e.altKey && !e.metaKey && (e.key === 'E' || e.key === 'e')) {
        const target = e.target;
        const typing = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable);
        if (typing) return;
        e.preventDefault();
        document.getElementById('download-local-data').click();
      }
    });

    document.getElementById('open-euler').addEventListener('click', () => openTask('19_EulerTask_plus3.html', 'euler'));
    document.getElementById('open-degree').addEventListener('click', () => openTask('14_DegreeSequenceTask.html', 'degree'));
    document.getElementById('open-park').addEventListener('click', () => openTask('3_ParkTask.html', 'park'));

    ghostCharacter.addEventListener('click', () => {
      if (!session.intro_done) return;
      showTaskChooserGhost();
    });

    document.addEventListener('click', (e) => {
      if (!session.intro_done) return;
      if (!ghostUI.contains(e.target)) {
        hideBubble();
        setGhostMinimized();
      }
    });

    if (!session.intro_done) {
      introOverlay.style.display = 'block';
      document.body.style.overflow = 'hidden';
      setGhostCentered();
      showBubble();
      renderIntroStep(session.intro_step || 1);
      addSessionLog('intro_overlay_shown');
    } else {
      document.body.style.overflow = '';
      introOverlay.style.display = 'none';
      setGhostMinimized();
      hideBubble();
    }

    uploadSessionSnapshot();
    applyTaskAvailability();
    if (session.intro_done) setupHubIdleIfAllowed();
  </script>
  <script>
    (function () {
      const HUB_VERSION = 'v17-new-drive-url';
      const prev = localStorage.getItem('digitool_hub_version');
      if (prev !== HUB_VERSION && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((r) => r.unregister());
        });
        if (typeof caches !== 'undefined') {
          caches.keys().then((keys) => {
            keys.filter((k) => k.indexOf('digitool') !== -1).forEach((k) => caches.delete(k));
          });
        }
        localStorage.setItem('digitool_hub_version', HUB_VERSION);
      }
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {});
        });
      }
    })();
  </script>
</body>
</html>
